# =============================================================================
# FACTORY BUILD - Seeed reTerminal D1001 (8" landscape ESP32-P4)
# =============================================================================
# Factory image: www.js bundled inline for first-boot web UI access.
# =============================================================================

substitutions:
  name: "espcontrol-tab5"
  friendly_name: "M5Stack Tab5 (Community)"
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

packages:
  core: !include ../devices/m5stack-esp32-p4-tab5/packages.yaml
  # Keyless API encryption: the device takes the first provisioning connection
  # in plaintext, then Home Assistant supplies a per-device Noise key it keeps.
  # No shared key is baked into a binary we hand out. Upstream wires the same
  # addon into its factory profiles and public entry points (jtenniswood/
  # espcontrol#1738) while leaving dev/local build profiles plaintext, which is
  # why builds/m5stack-esp32-p4-tab5.yaml does not include it.

esphome:
  name_add_mac_suffix: true
  project:
    name: lamiskin.espcontrol-community
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://lamiskin/espcontrol-community-devices/devices/m5stack-esp32-p4-tab5/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "../community-pages/webserver/www.js"

wifi:
  ap:
    ssid: "${name}"

captive_portal:

# Keyless API encryption, inlined from upstream's common/addon/
# api_encryption_dynamic.yaml (jtenniswood/espcontrol#1738). The device takes
# its first provisioning connection in plaintext, then Home Assistant supplies a
# per-device Noise key it persists — so no shared key is baked into a binary we
# hand out. Inlined rather than included because vendor_common.py only scans
# devices/ for common/ includes, so a build-profile include would never be
# vendored. Upstream keeps dev/local build profiles plaintext, which is why
# builds/m5stack-esp32-p4-tab5.yaml does not carry this.
api:
  encryption: {}
