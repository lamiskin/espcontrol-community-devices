# =============================================================================
# FACTORY BUILD - Guition ESP32-S3-JC3248W535 (3.5" landscape)
# =============================================================================
# Factory image: www.js bundled inline for first-boot web UI access.
# =============================================================================

substitutions:
  name: "espcontrol-jc3248w535"
  friendly_name: "Guition ESP32-S3-JC3248W535 (Community)"
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

packages:
  core: !include ../devices/guition-esp32-s3-jc3248w535/packages.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: lamiskin.espcontrol-community
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://lamiskin/espcontrol-community-devices/devices/guition-esp32-s3-jc3248w535/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "../community-pages/webserver/www.js"

wifi:
  ap:
    ssid: "${name}"

captive_portal:

# Keyless API encryption, inlined from upstream's common/addon/
# api_encryption_dynamic.yaml (jtenniswood/espcontrol#1738). The panel takes its
# first provisioning connection in plaintext, then Home Assistant supplies a
# per-device Noise key it persists — so no shared key is baked into a binary we
# hand out. Inlined rather than included because vendor_common.py only scans
# devices/ for common/ includes, so a build-profile include would never be
# vendored. The dev/CI profile (builds/guition-esp32-s3-jc3248w535.yaml) stays
# plaintext, matching upstream's split.
api:
  encryption: {}
