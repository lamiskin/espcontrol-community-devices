# =============================================================================
# FACTORY BUILD - Seeed SenseCAP Indicator D1 (4" square)
# =============================================================================
# This device has 8MB flash (the other 5 community devices have 16MB), and
# upstream's shared www.js bundle (~2.5MB as of v2.8.0, same app code for
# every device) no longer fits alongside firmware in its OTA partitions when
# embedded (js_include). Falls back to fetching www.js at runtime (js_url),
# same as this device's non-factory build already does — so the panel GUI
# needs network access on first boot instead of working immediately. See
# community/STATUS.md for the device-facing note.
# =============================================================================

substitutions:
  name: "espcontrol-sensecap-d1"
  friendly_name: "Seeed SenseCAP Indicator D1 (Community)"
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

packages:
  core: !include ../devices/seeed-sensecap-indicator-d1/packages.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: lamiskin.espcontrol-community
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://lamiskin/espcontrol-community-devices/devices/seeed-sensecap-indicator-d1/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: "https://lamiskin.github.io/espcontrol-community-devices/webserver/www.js"

wifi:
  ap:
    ssid: "${name}"

captive_portal:
