# =============================================================================
# BUILD PROFILE - Wireless-Tag WT32-SC01 Plus (3.5" landscape)
# =============================================================================
# CI/local build entry point for the 480x320 landscape ESP32-S3 panel.
# Loads the web UI from GitHub Pages so CI can skip building www.js.
# =============================================================================

substitutions:
  name: "espcontrol-wt32sc01p"
  friendly_name: "Wireless-Tag WT32-SC01 Plus (Community)"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

esphome:
  name_add_mac_suffix: true

packages:
  espcontrol: !include ../devices/wireless-tag-wt32-sc01-plus/packages.yaml

wifi:
  # Compile-only station credentials for CI/local builds. User-imported
  # deployed configs supply their real WiFi credentials in device YAML.
  ssid: "ESPControl"
  password: "espcontrol"
  ap:
    ssid: "${name}"

captive_portal:

web_server:
  js_url: "https://lamiskin.github.io/espcontrol-community-devices/webserver/www.js"
