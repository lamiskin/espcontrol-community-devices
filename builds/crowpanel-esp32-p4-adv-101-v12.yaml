# =============================================================================
# BUILD PROFILE - Elecrow CrowPanel Advanced 10.1" ESP32-P4 (V1.2)
# =============================================================================
# CI/local build entry point for the 1024x600 landscape ESP32-P4 panel.
# Loads the web UI from GitHub Pages so CI can skip building www.js.
# =============================================================================

substitutions:
  name: "espcontrol-cp-adv101-v12"
  friendly_name: "CrowPanel Advanced 10.1 V1.2 (Community)"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

esphome:
  name_add_mac_suffix: true

packages:
  espcontrol: !include ../devices/crowpanel-esp32-p4-adv-101-v12/packages.yaml

wifi:
  # Compile-only station credentials for CI/local builds. User-imported
  # deployed configs supply their real WiFi credentials in device YAML.
  ssid: "ESPControl"
  password: "espcontrol"
  ap:
    ssid: "${name}"

captive_portal:

web_server:
  js_url: "https://lamiskin.github.io/espcontrol-community-devices/webserver/www.js"
