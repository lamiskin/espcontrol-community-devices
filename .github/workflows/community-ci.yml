name: Community CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run policy check
        if: github.event_name == 'pull_request'
        run: |
          python3 community/scripts/check_policy.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}
      - name: Run script self-tests
        run: |
          python3 community/scripts/convert_packages.py --self-test
          python3 community/scripts/check_policy.py --self-test
          python3 community/scripts/check_include_parity.py --self-test
          python3 community/scripts/check_pin_consistency.py --self-test
          python3 community/scripts/vendor_common.py --self-test
          python3 community/scripts/generate_manifest.py --self-test
          python3 community/scripts/patch_preview_update.py --self-test
          python3 community/scripts/generate_versions_index.py --self-test
          python3 community/scripts/stage_firmware.py --self-test
          python3 community/scripts/check_ota_buffer.py --self-test
          python3 community/scripts/download_stats.py --self-test
          python3 community/scripts/check_status_consistency.py --self-test
          python3 community/scripts/check_generated_blocks.py --self-test
          python3 community/scripts/postprocess_www.py --self-test
          python3 community/scripts/generate_issue_labels.py --self-test
          python3 community/scripts/label_issue.py --self-test
          python3 community/scripts/builder_smoke.py --self-test
          python3 community/scripts/ui_stamp.py --self-test
          bash .github/scripts/retry.sh --self-test
      - name: Status consistency
        run: python3 community/scripts/check_status_consistency.py
      - name: OTA buffer override present
        run: python3 community/scripts/check_ota_buffer.py
      # A UI change that does not move the js_url stamp leaves self-builders
      # on a cached bundle until the Pages TTL expires.
      - name: UI cache stamp current
        run: python3 community/scripts/ui_stamp.py --check
      - name: Docs pages current
        run: python3 community/scripts/generate_docs.py --check
      - name: Issue labels & bug form current
        run: python3 community/scripts/generate_issue_labels.py --check

  determine-devices:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      devices: ${{ steps.find.outputs.devices }}
      has_devices: ${{ steps.find.outputs.has_devices }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find touched devices
        id: find
        run: |
          # Get changed files
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})

          # Extract device slugs from changed paths
          SLUGS=$(echo "$CHANGED" | grep -oP '^devices/\K[^/]+' | sort -u || true)

          # Also check builds/ changes
          BUILD_SLUGS=$(echo "$CHANGED" | grep -oP '^builds/\K[^.]+' | sed 's/\.factory$//' | sort -u || true)

          # Combine and deduplicate
          ALL_SLUGS=$(echo -e "$SLUGS\n$BUILD_SLUGS" | sort -u | grep -v '^$' || true)

          # Filter to only slugs registered in devices.json
          REGISTERED=$(python3 -c "import json; print('\n'.join(json.load(open('community/devices.json'))['devices']))")

          DEVICES=()
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            if echo "$REGISTERED" | grep -qx "$slug"; then
              DEVICES+=("$slug")
            fi
          done <<< "$ALL_SLUGS"

          if [ ${#DEVICES[@]} -eq 0 ]; then
            echo "devices=[]" >> $GITHUB_OUTPUT
            echo "has_devices=false" >> $GITHUB_OUTPUT
          else
            DEVICES_JSON=$(printf '%s\n' "${DEVICES[@]}" | jq -R . | jq -sc .)
            echo "devices=$DEVICES_JSON" >> $GITHUB_OUTPUT
            echo "has_devices=true" >> $GITHUB_OUTPUT
          fi

  assemble:
    runs-on: ubuntu-latest
    needs: [policy]
    steps:
      - uses: actions/checkout@v7
      - name: Assemble
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py --skip-checks --skip-web
      - name: Pin consistency
        run: python3 community/scripts/check_pin_consistency.py
      - name: Include parity
        env:
          UPSTREAM_CLONE: .assembly
        run: python3 community/scripts/check_include_parity.py
      - name: Vendored common check
        run: python3 community/scripts/vendor_common.py --source .assembly --check
      - name: Generated-block drift check
        run: python3 community/scripts/check_generated_blocks.py

  compile:
    runs-on: ubuntu-latest
    needs: [determine-devices, assemble]
    if: needs.determine-devices.outputs.has_devices == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.determine-devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
      - name: Assemble
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py --skip-web
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: |
          source .github/scripts/retry.sh
          retry pip install esphome==$(grep ESPHOME_VERSION .assembly/.github/esphome.env | cut -d= -f2)
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .assembly/.esphome
          key: pio-${{ matrix.device }}-${{ hashFiles('community/upstream-ref.txt') }}
          restore-keys: pio-${{ matrix.device }}-
      - name: Compile
        # See the nightly's compile step: a compile clones and downloads
        # before it builds, and a re-attempt reuses the PlatformIO cache.
        run: |
          source .github/scripts/retry.sh
          cd .assembly
          # Fix external_components path for non-Docker CI (no /config mount)
          ASSEMBLY_ABS="$(pwd)"
          sed -i "s|file:///config|file://${ASSEMBLY_ABS}|g" "builds/${{ matrix.device }}.yaml"
          RETRY_ATTEMPTS=3 retry esphome compile builds/${{ matrix.device }}.yaml

  # Single stable-named summary over the compile matrix so branch
  # protection can require it (matrix job names vary per device).
  # Passes when no devices were touched (compile skipped entirely).
  compile-result:
    runs-on: ubuntu-latest
    needs: [determine-devices, compile]
    if: always()
    steps:
      - name: Summarize compile matrix
        run: |
          HAS="${{ needs.determine-devices.outputs.has_devices }}"
          RESULT="${{ needs.compile.result }}"
          echo "has_devices=$HAS compile=$RESULT"
          if [ "$HAS" = "true" ] && [ "$RESULT" != "success" ]; then
            echo "Compile matrix did not succeed"; exit 1
          fi
          echo "OK"

  # Validate the *supported install path*: the compile job above rewrites
  # file:///config to a local assembly, so it never exercises the remote
  # package resolution a user (or the ESPHome Builder) actually runs. This
  # job resolves devices/<slug>/packages.yaml from the commit under test via
  # a local git URL and runs `esphome config`, catching config/pin schema
  # mismatches (e.g. issue #48) that only surface on that path. Validate-only
  # — firmware compilation stays with the compile matrix.
  builder-smoke:
    runs-on: ubuntu-latest
    needs: [determine-devices]
    if: needs.determine-devices.outputs.has_devices == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.determine-devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install ESPHome (upstream-pinned version)
        run: |
          source .github/scripts/retry.sh
          # Match the ESPHome version the pinned upstream ships/tests with,
          # so validation mirrors what a user's builder would resolve.
          REF=$(cat community/upstream-ref.txt)
          ENV_URL="https://raw.githubusercontent.com/jtenniswood/espcontrol/${REF}/.github/esphome.env"
          # Fetch and parse separately: piping curl straight into grep hides
          # a fetch failure behind grep's exit status, so a reset connection
          # surfaced as `pip install esphome==` with an empty version rather
          # than as the network error it was.
          ESPHOME_ENV=$(retry curl -sSfL --max-time 60 "$ENV_URL")
          VER=$(printf '%s\n' "$ESPHOME_ENV" | grep '^ESPHOME_VERSION=' | cut -d= -f2)
          if [ -z "$VER" ]; then
            echo "ERROR: no ESPHOME_VERSION found in $ENV_URL" >&2
            exit 1
          fi
          echo "Installing esphome==$VER (upstream pin $REF)"
          retry pip install "esphome==$VER"
      - name: Validate builder install path
        # Defaults: --repo-root this checkout, --ref HEAD (the PR merge commit).
        # esphome config clones the repo to resolve the package.
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/builder_smoke.py --slug "${{ matrix.device }}"

  # Stable-named summary over the builder-smoke matrix (see compile-result).
  builder-smoke-result:
    runs-on: ubuntu-latest
    needs: [determine-devices, builder-smoke]
    if: always()
    steps:
      - name: Summarize builder-smoke matrix
        run: |
          HAS="${{ needs.determine-devices.outputs.has_devices }}"
          RESULT="${{ needs.builder-smoke.result }}"
          echo "has_devices=$HAS builder-smoke=$RESULT"
          if [ "$HAS" = "true" ] && [ "$RESULT" != "success" ]; then
            echo "Builder-path validation did not succeed"; exit 1
          fi
          echo "OK"
