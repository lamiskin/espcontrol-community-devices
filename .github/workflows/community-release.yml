name: Community Release

on:
  push:
    tags:
      - "community-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (community-v*)"
        required: true

permissions:
  contents: write

jobs:
  # Version/device-list prep only — no compiling here. Kept as its own job
  # (rather than folded into `build`) so every matrix leg reads the same
  # tag/version/prerelease/device-list instead of each recomputing it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      devices: ${{ steps.devices.outputs.devices }}
      recovery_devices: ${{ steps.devices.outputs.recovery_devices }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Extract version from tag: community-vX.Y.Z+<pin> or community-vX.Y.Z-upstream.<pin>
          VERSION=$(echo "$TAG" | sed 's/^community-//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # A tag carrying -preview publishes as a GitHub prerelease. That
          # keeps it out of `gh release view` (which returns the latest stable
          # only), so community-pages.yml does not stage it as the current
          # firmware and no installed device is offered it as an update. Use it
          # to hand a porter a flashable binary before a device is public.
          case "$TAG" in
            *-preview*) PRERELEASE=true ;;
            *)          PRERELEASE=false ;;
          esac
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Publishing $TAG (prerelease=$PRERELEASE)"

      - name: Determine devices
        id: devices
        run: |
          DEVICES_JSON=$(python3 -c "import json; print(json.dumps(json.load(open('community/devices.json'))['devices']))")
          echo "devices=$DEVICES_JSON" >> $GITHUB_OUTPUT
          echo "Building: $DEVICES_JSON"

          # P4 panels use a separate ESP32-C6 chip for WiFi and need a
          # dedicated USB recovery build to repair it (issue #98) — see
          # generate_manifest.py's chip_family() for how a device's chip is
          # resolved from devices/<slug>/device/device.yaml.
          RECOVERY_JSON=$(python3 -c "
          import json, sys
          sys.path.insert(0, 'community/scripts')
          from generate_manifest import chip_family
          devices = json.load(open('community/devices.json'))['devices']
          print(json.dumps([s for s in devices if chip_family(s) == 'ESP32-P4']))
          ")
          echo "recovery_devices=$RECOVERY_JSON" >> $GITHUB_OUTPUT
          echo "C6 recovery builds: $RECOVERY_JSON"

  # One job per device (mirrors community-ci.yml's compile matrix) instead
  # of one job compiling all 8 in a loop: wall clock becomes the slowest
  # single device (~5-8 min) rather than their sum (~40 min), at the cost of
  # each device paying its own toolchain setup instead of sharing one warm
  # install (issue #105). fail-fast: false so a single device's failure
  # doesn't cancel the others mid-compile — release, below, only runs if
  # every leg here succeeded, so a partial failure still yields no release
  # (GitHub Actions skips a job whose `needs` didn't all succeed).
  build:
    runs-on: ubuntu-latest
    needs: [prepare]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Assemble
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          source .github/scripts/retry.sh
          retry pip install esphome==$(grep ESPHOME_VERSION .assembly/.github/esphome.env | cut -d= -f2)

      # Same key as community-ci.yml's compile matrix, so a release build can
      # start warm from a PR that already compiled this device recently.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .assembly/.esphome
          key: pio-${{ matrix.device }}-${{ hashFiles('community/upstream-ref.txt') }}
          restore-keys: pio-${{ matrix.device }}-

      - name: Compile and collect firmware
        run: |
          source .github/scripts/retry.sh
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          SLUG="${{ matrix.device }}"

          # Make www.js accessible where the factory build expects it
          mkdir -p .assembly/community-pages/webserver
          cp community-pages/webserver/www.js .assembly/community-pages/webserver/www.js

          mkdir -p release-artifacts

          cd .assembly

          # Patch firmware_version in the factory build
          sed -i "s/firmware_version: \"0.0.0\"/firmware_version: \"$VERSION\"/" \
            "builds/${SLUG}.factory.yaml" 2>/dev/null || true
          sed -i "s/firmware_version: \"dev\"/firmware_version: \"$VERSION\"/" \
            "builds/${SLUG}.factory.yaml" 2>/dev/null || true

          # A preview build must never let its update entity see the
          # stable channel: ESPHome compares update versions by string
          # inequality, not ordering, so a preview's version string always
          # differs from whatever manifest.json (stable only) currently
          # advertises — including looking "available" when stable is
          # actually OLDER, silently downgrading a panel deliberately put
          # on a preview and, worse, breaking Home Assistant's Noise
          # connection to any panel HA has already keyed (issue #106).
          # Pin this device's compiled update entity at this exact
          # release's own manifest (so latest_version == current_version
          # forever) and force its auto-update switch off.
          case "$TAG" in
            *-preview*)
              python3 ../community/scripts/patch_preview_update.py "$SLUG" \
                --tag "$TAG" --repo-root .
              ;;
          esac

          # Fix external_components path for non-Docker CI (no /config mount)
          ASSEMBLY_ABS="$(pwd)"
          sed -i "s|file:///config|file://${ASSEMBLY_ABS}|g" "builds/${SLUG}.factory.yaml"

          RETRY_ATTEMPTS=3 retry esphome compile "builds/${SLUG}.factory.yaml"

          # Find binaries
          FACTORY=$(find builds/.esphome/build -name "firmware.factory.bin" | head -1)
          OTA=$(find builds/.esphome/build -name "firmware.ota.bin" | head -1)

          if [ -z "$FACTORY" ] || [ -z "$OTA" ]; then
            echo "ERROR: compiled binaries not found for ${SLUG}" \
              "(factory='$FACTORY' ota='$OTA') — release aborted" >&2
            exit 1
          fi

          cp "$FACTORY" "../release-artifacts/${SLUG}.factory.bin"
          cp "$OTA" "../release-artifacts/${SLUG}.ota.bin"

          # Generate manifest (device name + chip family resolved from
          # the repo; hard-fails on ambiguity instead of defaulting)
          OTA_MD5=$(md5sum "../release-artifacts/${SLUG}.ota.bin" | cut -d' ' -f1)
          python3 ../community/scripts/generate_manifest.py "$SLUG" \
            --version "$VERSION" \
            --tag "$TAG" \
            --ota-md5 "$OTA_MD5" \
            --output "../release-artifacts/${SLUG}-manifest.json"

      # P4 panels use a separate ESP32-C6 chip for WiFi and need a dedicated
      # USB recovery build to repair it (issue #98). Both steps are
      # deliberately best-effort (continue-on-error): the recovery build is
      # a bonus artifact, not the release itself — a transient failure here
      # (e.g. the C6 firmware host having a bad day) must never block
      # shipping the real firmware for all 8 devices. A missing recovery
      # asset just means stage_recovery_manifests.py has nothing to stage
      # for this device until the next release.
      - name: Prepare C6 recovery firmware dependency
        if: contains(fromJson(needs.prepare.outputs.recovery_devices), matrix.device)
        continue-on-error: true
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/prepare_c6_firmware.py \
            --output .assembly/.firmware-deps/esp32-c6/2.12.12/network_adapter_esp32c6.bin

      - name: Compile and collect C6 recovery build
        if: contains(fromJson(needs.prepare.outputs.recovery_devices), matrix.device)
        continue-on-error: true
        run: |
          source .github/scripts/retry.sh
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          SLUG="${{ matrix.device }}"
          cd .assembly

          # The normal factory compile above already patched firmware_version,
          # the preview update-source pin, and file:///config in
          # builds/${SLUG}.factory.yaml. This build re-includes that same
          # file, so it inherits all three without re-patching.

          # Clean the previous (normal factory) build output first, so the
          # `find` below can only see this compile's binary, not a stale one
          # left over from the normal factory compile above.
          rm -rf builds/.esphome/build

          RETRY_ATTEMPTS=3 retry esphome compile "builds/${SLUG}.recovery.yaml"

          RECOVERY_FACTORY=$(find builds/.esphome/build -name "firmware.factory.bin" | head -1)
          if [ -z "$RECOVERY_FACTORY" ]; then
            echo "::warning::C6 recovery binary not found for ${SLUG} — skipping its recovery artifacts this release"
            exit 1
          fi
          cp "$RECOVERY_FACTORY" "../release-artifacts/${SLUG}.recovery.factory.bin"

          python3 ../community/scripts/generate_manifest.py "$SLUG" \
            --version "$VERSION" \
            --tag "$TAG" \
            --recovery \
            --output "../release-artifacts/${SLUG}-recovery-manifest.json"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.device }}
          path: release-artifacts/
          retention-days: 1

  # Runs only if every device in `build` succeeded (GitHub Actions skips a
  # job whose `needs` didn't all succeed) — a device that failed to compile
  # means no release, matching the old single-job loop's `exit 1`.
  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/retry.sh
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          UPSTREAM_REF=$(cat community/upstream-ref.txt)

          # Find previous release tag for changelog
          PREV_TAG=$(git tag --list 'community-v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          # Build release notes in a file (raw newlines inside a quoted shell
          # string would sit at column 0 and break the YAML block scalar)
          NOTES_FILE=$(mktemp)
          {
            echo "Based on [espcontrol ${UPSTREAM_REF}](https://github.com/jtenniswood/espcontrol/releases/tag/${UPSTREAM_REF})."
            echo ""
            echo "## What's Changed"
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}" -- | grep -v "^$" || true)
              if [ -n "$CHANGELOG" ]; then
                echo "$CHANGELOG"
              else
                echo "- No notable changes since ${PREV_TAG}"
              fi
            else
              echo "- Initial release"
            fi
          } > "$NOTES_FILE"

          # Collect all binary files
          FILES=$(find release-artifacts -name "*.bin" -o -name "*-manifest.json" | sort)
          PRERELEASE_FLAG=""
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          retry gh release create "$TAG" $FILES \
            --title "${VERSION}" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG

      # Pages deployment is owned entirely by community-pages.yml, which
      # triggers on this workflow's completion and rebuilds the site from
      # this release's attached assets. Deploying from here as well caused
      # a race between two whole-site deploys (one of which had no firmware
      # content in its checkout).
