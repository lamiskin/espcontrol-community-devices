name: Community Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (for testing on branches)"
        required: false
        default: ""

# Read-only by default; the report job widens this for itself. Without an
# explicit grant the run inherits the repository default, which is read-only
# here — that is why the first nightly to actually hit a broken device died
# with "Resource not accessible by integration (createIssue)".
permissions:
  contents: read

jobs:
  determine-devices:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: List all devices
        id: list
        run: |
          DEVICES=$(python3 -c "import json; print(json.dumps(json.load(open('community/devices.json'))['devices']))")
          echo "devices=$DEVICES" >> $GITHUB_OUTPUT

  # Single upstream-availability check, run once before the 8-device
  # matrix rather than left to fail independently inside each leg. A
  # per-device compile/builder-smoke failure below gets reported as that
  # device being broken — a [broken] issue and a STATUS.md flip — which is
  # right when the device's own config is actually at fault, but wrong
  # when upstream itself is unreachable (a deleted/repointed release tag,
  # a GitHub outage): that fails every device identically and says nothing
  # about any of them. This happened for real: upstream deleted v2.8.5 and
  # nightly filed 8 near-identical "broken" issues + flipped 8 STATUS.md
  # rows, when the true story was one sentence about upstream, not eight
  # devices. This job isolates that shared failure mode into one tracking
  # issue and skips the matrix below entirely instead of misreporting it
  # eight times over.
  verify-upstream-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write        # open/comment/close the single tracking issue
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve and verify upstream pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/retry.sh
          DISPLAY_REF=$(cat community/upstream-ref.txt)
          REF=$(cat community/upstream-sha.txt 2>/dev/null || echo "$DISPLAY_REF")
          ENV_URL="https://raw.githubusercontent.com/jtenniswood/espcontrol/${REF}/.github/esphome.env"
          ISSUE_TITLE="[infra] upstream pin unreachable"

          # Same fetch+parse-separately shape as builder-smoke below: piping
          # curl straight into grep would hide a fetch failure behind
          # grep's exit status.
          if ESPHOME_ENV=$(retry curl -sSfL --max-time 60 "$ENV_URL") \
             && printf '%s\n' "$ESPHOME_ENV" | grep -q '^ESPHOME_VERSION='; then
            echo "Upstream pin $DISPLAY_REF ($REF) resolves fine."
            EXISTING=$(retry gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              retry gh issue close "$EXISTING" \
                --comment "Upstream pin resolves again as of $(date -u +%Y-%m-%d) ($DISPLAY_REF / $REF).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            exit 0
          fi

          echo "::error::Upstream pin $DISPLAY_REF ($REF) did not resolve at $ENV_URL"

          BODY="Nightly could not resolve the pinned upstream ref on $(date -u +%Y-%m-%d) — fetching \`.github/esphome.env\` failed.

          Pin: \`$DISPLAY_REF\` ($REF)
          URL: $ENV_URL

          This means upstream's tag likely moved, was deleted, or GitHub had a transient issue — it is **not** a sign that any community device config is broken. Compile and builder-smoke were skipped this run; STATUS.md and the per-device \`[broken]\` issues were left untouched. Likely fix: wait for Community Ref Bump to pick up a newer upstream release, or re-run this workflow once upstream is reachable again.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          EXISTING=$(retry gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            retry gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label "sync-broken"
          else
            retry gh issue comment "$EXISTING" --body "$BODY"
          fi
          exit 1

  compile:
    runs-on: ubuntu-latest
    needs: [determine-devices, verify-upstream-pin]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.determine-devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
      - name: Assemble
        # Clones upstream; clone_upstream() wipes .assembly/ first, so a
        # retry after a half-finished clone starts clean. Builds the real
        # web bundle (no --skip-web): this is the only place besides an
        # actual release tag that runs postprocess_www.py and produces
        # community-pages/webserver/www.js, which the factory compile step
        # below needs. Catching a bundle-path or URL-rewrite break here
        # costs a nightly red X instead of a failed release.
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: |
          source .github/scripts/retry.sh
          retry pip install esphome==$(grep ESPHOME_VERSION .assembly/.github/esphome.env | cut -d= -f2)
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .assembly/.esphome
          key: pio-nightly-${{ matrix.device }}-${{ hashFiles('community/upstream-ref.txt') }}
          restore-keys: pio-nightly-${{ matrix.device }}-
      - name: Compile
        id: compile
        # A compile is not just a build: it git-clones the pinned upstream and
        # downloads remote fonts and toolchains first, and any of those can be
        # reset mid-flight. Retries are cheap either way — a genuinely broken
        # config fails in seconds during validation, and a re-attempt after a
        # partial build reuses PlatformIO's cache. Fewer attempts than the
        # default, since the slow case is a real compile.
        #
        # Compiles both the OTA build and the factory build. The factory
        # build embeds community-pages/webserver/www.js into the firmware
        # binary (js_include) and is only ever compiled otherwise by the
        # release workflow — a device whose bundle no longer fits its flash
        # partitions (as happened for seeed-sensecap-indicator-d1 at v2.8.0)
        # would not fail here without this, only during an actual release.
        run: |
          source .github/scripts/retry.sh
          cd .assembly
          # Fix external_components path for non-Docker CI (no /config mount)
          ASSEMBLY_ABS="$(pwd)"
          sed -i "s|file:///config|file://${ASSEMBLY_ABS}|g" "builds/${{ matrix.device }}.yaml" "builds/${{ matrix.device }}.factory.yaml"
          RETRY_ATTEMPTS=3 retry esphome compile builds/${{ matrix.device }}.yaml
          # Free the first build's output before the second — this job now
          # compiles two full firmware images back to back (release.yml only
          # ever builds one per device), and runner disk is finite.
          rm -rf builds/.esphome/build
          RETRY_ATTEMPTS=3 retry esphome compile builds/${{ matrix.device }}.factory.yaml

  # Validate the supported install path against the *published* repo URL, so
  # nightly also catches broken remote wiring / GitHub-side resolution that
  # the PR-time local (file://) check can't. Validate-only; see
  # community/scripts/builder_smoke.py and Community CI's builder-smoke job.
  builder-smoke:
    runs-on: ubuntu-latest
    needs: [determine-devices, verify-upstream-pin]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.determine-devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install ESPHome (upstream-pinned version)
        run: |
          source .github/scripts/retry.sh
          # Prefer the resolved commit SHA over the tag name when one has
          # been recorded (community/upstream-sha.txt) — see verify-
          # upstream-pin above and assemble.py's clone_upstream(). A tag
          # can be deleted or repointed upstream after the fact; a SHA
          # can't.
          REF=$(cat community/upstream-sha.txt 2>/dev/null || cat community/upstream-ref.txt)
          ENV_URL="https://raw.githubusercontent.com/jtenniswood/espcontrol/${REF}/.github/esphome.env"
          # Fetch and parse separately: piping curl straight into grep hides
          # a fetch failure behind grep's exit status, so a reset connection
          # surfaced as `pip install esphome==` with an empty version rather
          # than as the network error it was.
          ESPHOME_ENV=$(retry curl -sSfL --max-time 60 "$ENV_URL")
          VER=$(printf '%s\n' "$ESPHOME_ENV" | grep '^ESPHOME_VERSION=' | cut -d= -f2)
          if [ -z "$VER" ]; then
            echo "ERROR: no ESPHOME_VERSION found in $ENV_URL" >&2
            exit 1
          fi
          echo "Installing esphome==$VER (upstream pin $REF)"
          retry pip install "esphome==$VER"
      - name: Validate published builder path
        # esphome config clones this repo from GitHub to resolve the package.
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/builder_smoke.py \
            --slug "${{ matrix.device }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --ref "${{ inputs.ref || 'main' }}"

  report:
    runs-on: ubuntu-latest
    needs: [determine-devices, compile]
    if: always()
    permissions:
      contents: write        # push the nightly-status branch
      issues: write          # open / comment on / close [broken] issues
      pull-requests: write   # open the STATUS.md PR and enable auto-merge
      actions: write         # read this run's jobs, dispatch CI on the branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Process results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/retry.sh

          DEVICES=$(python3 -c "import json; print('\n'.join(json.load(open('community/devices.json'))['devices']))")

          STATUS_CHANGED=false

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue

            # Check if this device's compile job succeeded. Scope to the
            # compile matrix specifically — other per-device jobs (e.g.
            # builder-smoke) also contain the slug and would otherwise return
            # multiple conclusions and corrupt this comparison.
            JOB_RESULT=$(retry gh run view ${{ github.run_id }} --json jobs --jq ".jobs[] | select((.name | startswith(\"compile\")) and (.name | contains(\"$slug\"))) | .conclusion" 2>/dev/null || echo "unknown")

            ISSUE_TITLE="[broken] $slug"

            if [ "$JOB_RESULT" = "failure" ]; then
              # Search for existing open issue with this title
              EXISTING=$(retry gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)

              if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
                # Create new issue. Retried like the reads: a create that
                # fails after the issue landed server-side would duplicate on
                # the retry, but that is a narrow window next to losing the
                # whole report job to one API blip.
                retry gh issue create \
                  --title "$ISSUE_TITLE" \
                  --body "Nightly compile failed for \`$slug\` on $(date -u +%Y-%m-%d).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Pin: $(cat community/upstream-ref.txt)" \
                  --label "broken"
                echo "Created issue: $ISSUE_TITLE"
              else
                # Comment on existing issue
                retry gh issue comment "$EXISTING" \
                  --body "Still broken as of $(date -u +%Y-%m-%d).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo "Updated issue #$EXISTING: $ISSUE_TITLE"
              fi

              # Update STATUS.md to Broken
              python3 -c "
          import re
          with open('community/STATUS.md', 'r') as f:
              content = f.read()
          pattern = r'(\| [^|]+ \| $slug \| )\w+( \|)'
          new_content = re.sub(pattern, r'\g<1>Broken\g<2>', content)
          if new_content != content:
              with open('community/STATUS.md', 'w') as f:
                  f.write(new_content)
              print(f'STATUS.md: $slug -> Broken')
          " && STATUS_CHANGED=true

            elif [ "$JOB_RESULT" = "success" ]; then
              # Device compiles — check if it was previously broken
              EXISTING=$(retry gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)

              if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
                # Close the broken issue
                retry gh issue close "$EXISTING" \
                  --comment "Device compiles again as of $(date -u +%Y-%m-%d). Restoring status.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo "Closed issue #$EXISTING: $ISSUE_TITLE"
              fi

              # Restore STATUS.md — if it says Broken, set to Untested
              # (Working is only set by hardware verification)
              python3 -c "
          import re
          with open('community/STATUS.md', 'r') as f:
              content = f.read()
          pattern = r'(\| [^|]+ \| $slug \| )Broken( \|)'
          new_content = re.sub(pattern, r'\g<1>Untested\g<2>', content)
          if new_content != content:
              with open('community/STATUS.md', 'w') as f:
                  f.write(new_content)
              print(f'STATUS.md: $slug -> Untested (recovered)')
          " && STATUS_CHANGED=true
            fi
          done <<< "$DEVICES"

          # Open an auto-merged PR for STATUS.md changes (main is branch-
          # protected; direct pushes are rejected). PRs created with
          # GITHUB_TOKEN do not trigger pull_request workflows, so we
          # dispatch Community CI on the branch explicitly — its check runs
          # land on the same head SHA and satisfy the required checks.
          if [ "$STATUS_CHANGED" = "true" ] && ! git diff --quiet -- community/STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH="nightly-status/$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            # Device docs pages and the README device list embed the status,
            # so regenerate them in the same commit — otherwise CI's
            # docs-current check fails this PR and auto-merge never completes.
            python3 community/scripts/generate_docs.py
            git add community/STATUS.md docs/ README.md
            git commit -m "chore: nightly status update"
            retry git push -u origin "$BRANCH"
            retry gh pr create --base main --head "$BRANCH" \
              --title "chore: nightly status update $(date -u +%Y-%m-%d)" \
              --body "Automated STATUS.md flips from the nightly compile run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            retry gh workflow run community-ci.yml --ref "$BRANCH"
            retry gh pr merge "$BRANCH" --auto --merge --delete-branch
          fi
