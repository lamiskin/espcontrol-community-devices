name: Community Pages

# Single owner of the GitHub Pages deployment. Rebuilds the ENTIRE site on
# every run:
#   - the VitePress docs site (device pages generated from STATUS + catalog)
#   - firmware manifests: downloaded from the latest GitHub Release (the .bin
#     binaries are served directly from the release assets, not re-hosted here)
#   - firmware version index: versions.json per device, assembled from the
#     manifests of the last few releases (the panel's rollback list)
#   - webserver/www.js: built from the assembled tree at the current pin
# Triggered after releases, on status/registry changes to main, or manually.
# No other workflow may deploy Pages — a second deployer caused a race
# between whole-site deploys.

on:
  workflow_run:
    workflows: ["Community Release"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - community/STATUS.md
      - community/devices.json
      - community/retired-devices.json
      - community/catalog-fragment.json
      - community/scripts/generate_docs.py
      - community/scripts/stage_firmware.py
      - community/scripts/stage_recovery_manifests.py
      - docs/**
      - package.json
  # Daily rebuild so the download-stats page stays semi-live (GitHub's
  # download_count updates roughly hourly; a daily refresh is plenty).
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install docs dependencies
        run: |
          source .github/scripts/retry.sh
          retry npm ci

      - name: Generate device docs pages
        run: python3 community/scripts/generate_docs.py

      # Live per-device download counts from the Release-asset API. Runs each
      # build (incl. the daily schedule) so the stats page stays semi-live.
      # Non-fatal by design: a fetch failure writes a fallback page and exits
      # 0 so it can never block the docs/installer deploy.
      - name: Generate download-stats page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 community/scripts/download_stats.py

      # VitePress empties community-pages/, so it must run before firmware
      # and www.js are staged into it.
      - name: Build docs site
        run: npx vitepress build docs

      - name: Assemble (builds www.js)
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py --skip-checks

      - name: Stage firmware manifests and version index from releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/retry.sh
          mkdir -p release-assets
          # Distinguish "no release exists" (fine: deploy without firmware)
          # from a transient API failure (fatal: deploying a firmware-less
          # site over a good one is how an outage broke the installer once).
          # A repo with no releases burns the retries before reporting that,
          # which costs a minute once rather than a bad deploy repeatedly.
          if ! TAG=$(retry gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/tmp/relerr); then
            if grep -qiE "release not found|HTTP 404" /tmp/relerr; then
              echo "No releases exist yet — deploying docs without firmware content."
              exit 0
            fi
            echo "ERROR: could not query latest release:" >&2
            cat /tmp/relerr >&2
            exit 1
          fi
          echo "Latest release: $TAG"
          # Manifests are staged onto Pages here; the .bin files stay on the
          # release assets (their download_count is the per-device metric)
          # EXCEPT for a couple of ota.bin files mirrored further down for
          # the CORS fix (issue #104) — narrow and deliberate, not a return
          # to re-hosting everything, which is what broke Pages during an
          # outage.
          # --clobber so a retry after a partial download (e.g. a transient
          # HTTP 504 mid-fetch) overwrites the manifests already pulled
          # instead of failing with "already exists" — without it no retry
          # can recover once the first attempt lands any file.
          if ! retry gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "*-manifest.json" \
              --dir release-assets --clobber; then
            echo "ERROR: release asset download failed after retries" >&2
            exit 1
          fi
          # Registry-driven, NOT asset-driven: releases are immutable, so a
          # removed device keeps shipping its manifest asset forever and a
          # loop over the downloaded files republishes its update feed after
          # the device is gone. stage_firmware.py publishes the slugs in
          # community/devices.json plus the handover feeds in
          # community/retired-devices.json, and ignores everything else.
          python3 community/scripts/stage_firmware.py \
            --assets release-assets \
            --dest community-pages/firmware \
            --tag "$TAG"

          # P4 devices' C6 recovery manifest (issue #98), when this release
          # built one — best effort, never fails the deploy (see the
          # script's own docstring).
          python3 community/scripts/stage_recovery_manifests.py \
            --assets release-assets \
            --dest community-pages/firmware

          # The panel also fetches firmware/<slug>/versions.json — the latest
          # plus up to four previous releases, which is what the "Previous
          # firmware" rollback panel lists. Without it every panel 404s on
          # that request (issue #55). Build it from the release manifests
          # themselves so it is regenerated from truth on every deploy.
          mkdir -p "release-assets/history/$TAG"
          cp release-assets/*-manifest.json "release-assets/history/$TAG/" 2>/dev/null || true
          # Also mirror $TAG's ota.bin assets for the CORS fix below —
          # best effort: a failure here only means this release's web
          # installs stay CORS-blocked, not that the deploy fails.
          MIRROR_TAGS="$TAG"
          if ! retry gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "*.ota.bin" \
              --dir "release-assets/history/$TAG" --clobber; then
            echo "WARNING: could not fetch ota.bin assets for $TAG — its rollback/preview web installs stay CORS-blocked"
          fi
          # Latest first, then the four releases before it. Order comes from
          # the API, never from parsing our version strings.
          TAGS="$TAG"
          # Prereleases are deliberately KEPT here. `gh release view` above
          # returns the latest stable, so manifest.json — the only thing the
          # update entity polls — never advertises a -preview build and no
          # panel auto-upgrades to one. versions.json is the manual picker:
          # the UI filters out the advertised latest and the installed version
          # (previousFirmwareInfos in firmware_update_state.ts) and installs an
          # entry only when someone presses the install button. So listing a
          # preview here makes it choosable, never automatic.
          # --limit 6 | head -5 rather than 5 | head -4: a preview occupies a
          # slot, and this keeps the same number of genuine older releases.
          prev_count=0
          for prev in $(retry gh release list --repo "$GITHUB_REPOSITORY" --limit 6 \
              --json tagName --jq '.[].tagName' | grep -vxF "$TAG" | head -5); do
            # Best effort: a hiccup fetching an OLD release just shortens the
            # rollback list, and the next deploy rebuilds it. Only the latest
            # release is load-bearing, and its download above is already fatal.
            if retry gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
                --pattern "*-manifest.json" \
                --dir "release-assets/history/$prev" --clobber; then
              TAGS="$TAGS $prev"
              prev_count=$((prev_count + 1))
              # Mirror ota.bin for the single most recent OTHER release too
              # (issue #104) — deliberately just this one on top of $TAG:
              # every release served from Pages instead of a release asset
              # stops counting toward the per-device download stats this
              # project also cares about (39b32eb), so only the releases
              # someone would actually reach for (current + most recent
              # other, which for a device that's been auto-pinned off the
              # stable channel by #106 is very often the one they want to
              # move back to or the preview they want to test) are mirrored.
              if [ "$prev_count" -eq 1 ]; then
                MIRROR_TAGS="$MIRROR_TAGS $prev"
                if ! retry gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
                    --pattern "*.ota.bin" \
                    --dir "release-assets/history/$prev" --clobber; then
                  echo "WARNING: could not fetch ota.bin assets for $prev — its rollback/preview web installs stay CORS-blocked"
                fi
              fi
            else
              echo "WARNING: could not fetch manifests for $prev — omitting it"
            fi
          done
          # devices.json only, so a retired slug gets its handover
          # manifest.json but no versions.json: the rollback list would
          # otherwise offer builds of a device this project no longer has, and
          # the handover is meant to be a one-way door. Those panels get a
          # real rollback list once they land on the successor's feed.
          python3 community/scripts/generate_versions_index.py \
            --assets-dir release-assets/history \
            --tags $TAGS \
            --output-root community-pages/firmware

          # Rewrite ota.path for entries in MIRROR_TAGS to the copy staged
          # above, so the browser can install them without hitting GitHub's
          # release-download CORS wall (issue #104). manifest.json — the
          # device's own update entity — is never touched by this script.
          python3 community/scripts/mirror_rollback_ota.py \
            --assets-dir release-assets/history \
            --firmware-root community-pages/firmware \
            --tags $MIRROR_TAGS

          echo "Firmware manifests staged from $TAG:"
          # Guarded: stage_firmware.py legitimately stages nothing when a
          # release carries no manifests, and a bare find would fail the step.
          find community-pages/firmware -type f 2>/dev/null | sort || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: community-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
