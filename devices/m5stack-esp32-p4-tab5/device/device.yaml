# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_flags:
    - "-Wno-deprecated-declarations"
    - "-DESPCONTROL_DISABLE_TODO=1"
    # Force cached ESPHome objects to rebuild after the 2026.5
    # core/scheduler/watchdog changes; stale 2026.4 objects can boot-loop.
    - "-DESPCONTROL_ESPHOME_2026_5_REBUILD=1"
  on_boot:
    - priority: 260
      then:
        - if:
            condition:
              lambda: |-
                #ifdef USE_ESP32_CRASH_HANDLER
                return esphome::esp32::crash_handler_has_data();
                #else
                return false;
                #endif
            then:
              - lambda: |-
                  #ifdef USE_ESP32_CRASH_HANDLER
                  esphome::esp32::crash_handler_clear();
                  #endif
                  id(tab5_safe_mode).mark_successful();
                  global_preferences->sync();
                  ESP_LOGW("m5stack_tab5_v2", "Cleared saved crash report before API logging; rebooting once");
              - delay: 500ms
              - lambda: |-
                  App.safe_reboot();
    - priority: -100
      then:
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: apply_screen_rotation

# ---------------------------------------------------------------------------
# ESP32-C6 co-processor (provides WiFi/BLE via SDIO)
# ---------------------------------------------------------------------------
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

# ---------------------------------------------------------------------------
# PSRAM (video frame buffer memory)
# ---------------------------------------------------------------------------
psram:
  mode: hex
  speed: 200MHz

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: tab5_safe_mode

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# Tab5 exposes application logs over its USB-C port via native USB-JTAG
# (no separate UART0 serial bridge like the 10.1" panel).
logger:
  hardware_uart: USB_SERIAL_JTAG

# ---------------------------------------------------------------------------
# Power management (LDO channel for DSI PHY)
# ---------------------------------------------------------------------------
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: True

# ---------------------------------------------------------------------------
# I2C GPIO expanders (display/touch reset lines, WiFi/USB/charge power)
# ---------------------------------------------------------------------------
pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

# ---------------------------------------------------------------------------
# I2C bus (display/touch expanders + touchscreen)
# ---------------------------------------------------------------------------
i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

# ---------------------------------------------------------------------------
# Backlight (LEDC PWM output + monochromatic light entity)
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO22
    id: gpio_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                auto now = panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now());
                return (id(espcontrol_app).display().target_source_is(
                            espcontrol::DisplayRequestSource::SCREEN_SCHEDULE) &&
                        id(espcontrol_app).display().target_mode_is(
                            espcontrol::DisplayMode::DISPLAY_OFF)) ||
                       screen_schedule_waiting_for_time(
                         id(screen_schedule_trigger).state,
                         id(schedule_enabled).state,
                         now.is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(espcontrol_app).display().current_mode_is(
                          espcontrol::DisplayMode::DISPLAY_OFF);
                  then:
                    - script.execute: screensaver_wake
    on_turn_off:
      then:
        - if:
            condition:
              lambda: |-
                return id(espcontrol_app).display().takeover_active(
                           espcontrol::DisplayTakeoverKind::INTERACTIVE) ||
                       id(espcontrol_app).display().takeover_active(
                           espcontrol::DisplayTakeoverKind::CRITICAL);
            then:
              - lambda: 'ESP_LOGD("backlight", "Restoring backlight after OFF event during display takeover");'
              - delay: 10ms
              - script.execute: backlight_apply_brightness
            else:
              - script.execute: display_backlight_handle_off
    on_state:
      then:
        - script.execute: display_backlight_handle_state

# ---------------------------------------------------------------------------
# Touchscreen (ST7123, wakes screensaver on touch)
# ---------------------------------------------------------------------------
touchscreen:
  - platform: st7123
    id: my_touchscreen
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    i2c_id: bsp_bus
    interrupt_pin: GPIO23
    reset_pin: {pi4ioe5v6408: pi4ioe1, number: 5}
    on_touch:
      - script.execute: cover_art_pause_after_touch
      - script.wait: cover_art_pause_after_touch
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (5" 1280x720 landscape MIPI DSI panel; raw buffer is 720x1280)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: my_display
    # ST7123 driver revision (matches the "st7123" touchscreen platform below).
    # "M5STACK-TAB5-V2" is a deprecated alias for this model as of ESPHome
    # 2026.8; if your unit uses the ST7121 controller instead, switch to
    # "M5STACK-TAB5-ST7121".
    model: M5STACK-TAB5-ST7123
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      height: 1280
      width: 720

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  displays: my_display
  rotation: 270
  byte_order: little_endian
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

# ---------------------------------------------------------------------------
# WiFi power / antenna switches (via the I2C GPIO expanders)
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    id: wifi_power
    name: "WiFi Power"
    restore_mode: ALWAYS_ON

  - platform: gpio
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
    id: wifi_antenna_select
    name: "WiFi Antenna Select"
    restore_mode: ALWAYS_ON

# ---------------------------------------------------------------------------
# Screen rotation (select "0" reproduces the panel's native 270 LVGL
# rotation; each step below rotates -90 from there, matching the shared
# 180-degree display offset convention used across P4 panels)
# ---------------------------------------------------------------------------
script:
  - id: apply_screen_rotation
    then:
      - if:
          condition:
            lambda: 'return id(screen_rotation_select).current_option() == "90";'
          then:
            - lvgl.display.set_rotation: 0
          else:
            - if:
                condition:
                  lambda: 'return id(screen_rotation_select).current_option() == "180";'
                then:
                  - lvgl.display.set_rotation: 90
                else:
                  - if:
                      condition:
                        lambda: 'return id(screen_rotation_select).current_option() == "270";'
                      then:
                        - lvgl.display.set_rotation: 180
                      else:
                        - lvgl.display.set_rotation: 270
      - script.execute: cover_art_apply_responsive_layout

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "0"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(screen_rotation_ready);'
            then:
              - script.execute: apply_screen_rotation
              - script.execute: refresh_button_grid
