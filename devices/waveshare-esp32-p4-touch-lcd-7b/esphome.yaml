# =============================================================================
# ESPHOME ENTRY POINT - Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
# =============================================================================
# User-facing config file. Set your device name and WiFi credentials here.
# The remote package reference pulls in the full device configuration from
# GitHub so the device stays up-to-date automatically.
#
# Needs a secrets.yaml beside this file (or in the ESPHome config root) with:
#   wifi_ssid: "..."
#   wifi_password: "..."
# =============================================================================

# ---------------------------------------------------------------------------
# Device identity
# ---------------------------------------------------------------------------
substitutions:
  name: "wall-panel"
  friendly_name: "Wall Panel"

# ---------------------------------------------------------------------------
# WiFi credentials (stored in secrets.yaml)
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------------------
# Remote package (pulls full config from GitHub)
# ---------------------------------------------------------------------------
packages:
  setup:
    url: https://github.com/bassrock/espcontrol-community-devices/
    file: devices/waveshare-esp32-p4-touch-lcd-7b/packages.yaml
    refresh: 1s

# ---------------------------------------------------------------------------
# Keyless API encryption. ESPHome native - nothing is pulled in for this.
# The first provisioning connection is plaintext; Home Assistant then supplies
# a per-device Noise key the panel persists, so no shared key is baked into the
# binary. Set your own api.encryption.key here to override it.
# ---------------------------------------------------------------------------
api:
  encryption: {}
