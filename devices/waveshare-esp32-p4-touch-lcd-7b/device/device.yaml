        subpage_chunks: [subpage_12_config, subpage_12_config_ext, subpage_12_config_ext_2, subpage_12_config_ext_3, subpage_12_config_ext_4, subpage_12_config_ext_5, subpage_12_config_ext_6, subpage_12_config_ext_7]
      - config: button_13_config
        subpage_chunks: [subpage_13_config, subpage_13_config_ext, subpage_13_config_ext_2, subpage_13_config_ext_3, subpage_13_config_ext_4, subpage_13_config_ext_5, subpage_13_config_ext_6, subpage_13_config_ext_7]
      - config: button_14_config
        subpage_chunks: [subpage_14_config, subpage_14_config_ext, subpage_14_config_ext_2, subpage_14_config_ext_3, subpage_14_config_ext_4, subpage_14_config_ext_5, subpage_14_config_ext_6, subpage_14_config_ext_7]
      - config: button_15_config
        subpage_chunks: [subpage_15_config, subpage_15_config_ext, subpage_15_config_ext_2, subpage_15_config_ext_3, subpage_15_config_ext_4, subpage_15_config_ext_5, subpage_15_config_ext_6, subpage_15_config_ext_7]
# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_flags:
    - "-Wno-deprecated-declarations"
    # Force cached ESPHome objects to rebuild after the 2026.5
    # core/scheduler/watchdog changes; stale 2026.4 objects can boot-loop.
    - "-DESPCONTROL_ESPHOME_2026_5_REBUILD=1"
    # Rebuild marker for the 7B port.
    - "-DESPCONTROL_WAVESHARE_P4_7B_20260917=1"
    # Keep the ESP-IDF header warning suppressed without warning on C sources.
    - "-Wno-literal-suffix"
    - "-Wno-complain-wrong-lang"
  on_boot:
    - priority: 260
      then:
        - if:
            condition:
              lambda: |-
                #ifdef USE_ESP32_CRASH_HANDLER
                return esphome::esp32::crash_handler_has_data();
                #else
                return false;
                #endif
            then:
              - lambda: |-
                  #ifdef USE_ESP32_CRASH_HANDLER
                  esphome::esp32::crash_handler_clear();
                  #endif
                  global_preferences->sync();
                  ESP_LOGW("waveshare_p4_7b", "Cleared saved crash report before API logging; rebooting once while preserving the failed-boot counter");
              - delay: 500ms
              - lambda: |-
                  // Avoid safe_reboot(): its safe-mode shutdown hook clears
                  // the failed-boot counter before the replacement boot.
                  App.reboot();
    - priority: 250
      then:
        - lambda: |-
            ESP_LOGI("waveshare_p4_7b", "Waveshare ESP32-P4-WIFI6-Touch-LCD-7B boot");
    # The GT911's reset is tied to the LCD reset line (GPIO33) - the vendor BSP
    # comments it as "Shared with LCD reset" and wires no dedicated touch reset.
    # The display driver drives that line during init, so the touch controller is
    # still coming out of reset when the touchscreen driver first probes it. Give
    # it time to settle, exactly as the waveshare-10 profile does for the same
    # shared-reset arrangement.
    - priority: -150
      then:
        - delay: 300ms
    - priority: -100
      then:
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: apply_screen_rotation

# The P4 panel has enough memory for additional native API clients. Allow
# Home Assistant, ESPHome logs, and browser/configuration sessions to overlap
# without rejecting connections at ESPHome's default five-client limit.
api:
  max_connections: 8

# ---------------------------------------------------------------------------
# PSRAM (video frame buffer memory)
# ---------------------------------------------------------------------------
psram:
  mode: hex
  speed: 200MHz

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: waveshare_p4_7b_safe_mode

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# ---------------------------------------------------------------------------
# Power management (LDO channels for DSI PHY and SD card)
# ---------------------------------------------------------------------------
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: True
  - channel: 4
    id: sd_card_power
    voltage: 2.7V
    adjustable: True

# ---------------------------------------------------------------------------
# Backlight (LEDC PWM output + monochromatic light entity)
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    # 7B backlight is ACTIVE LOW. The vendor BSP drives GPIO32 at 5 kHz with
    # ledcOutputInvert(true), so duty 1023 = full brightness. `inverted: true`
    # on the pin reproduces that; without it the panel is dark at 100%.
    pin:
      number: GPIO32
      inverted: true
    id: gpio_backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                auto now = panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now());
                return (id(espcontrol_app).display().target_source_is(
                            espcontrol::DisplayRequestSource::SCREEN_SCHEDULE) &&
                        id(espcontrol_app).display().target_mode_is(
                            espcontrol::DisplayMode::DISPLAY_OFF)) ||
                       screen_schedule_waiting_for_time(
                         id(screen_schedule_trigger).state,
                         id(schedule_enabled).state,
                         now.is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(espcontrol_app).display().current_mode_is(
                          espcontrol::DisplayMode::DISPLAY_OFF);
                  then:
                    - script.execute: screensaver_wake
    on_turn_off:
      then:
        - script.execute: display_backlight_handle_off
    on_state:
      then:
        - script.execute: display_backlight_handle_state

# ---------------------------------------------------------------------------
# I2C bus and touchscreen (GT911 capacitive, wakes screensaver on touch)
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    sda_pullup_enabled: False
    scl_pullup_enabled: False


touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    i2c_id: bus_a
    # Run after the display so the shared reset line is already released.
    setup_priority: -200
    # The 7B wires neither a dedicated GT911 reset nor its interrupt: the vendor
    # BSP sets BSP_LCD_TOUCH_RST and BSP_LCD_TOUCH_INT to GPIO_NUM_NC (GPIO21/22
    # are the CAN pins here). ESPHome polls over I2C and falls back from 0x5D to
    # 0x14 on its own, so no address is pinned.
    # Orientation follows the BSP's bsp_touch_new() default for this panel:
    # swap_xy 0, mirror_x 1, mirror_y 1.
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    on_touch:
      - script.execute: cover_art_pause_after_touch
      - script.wait: cover_art_pause_after_touch
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (7" 1024x600 MIPI DSI panel)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: my_display
    # ESPHome ships no model for this panel (mipi_dsi/models/waveshare.py has
    # only P4-NANO-10.1, 3.4C and 4C), so it is declared inline as CUSTOM.
    # EK79007, 1024x600, 2 MIPI-DSI lanes.
    model: CUSTOM
    color_order: RGB
    reset_pin:
      number: GPIO33
    dimensions:
      width: 1024
      height: 600
    lanes: 2
    pclk_frequency: 52MHz
    lane_bit_rate: 1Gbps
    hsync_pulse_width: 10
    hsync_back_porch: 160
    hsync_front_porch: 160
    vsync_pulse_width: 1
    vsync_back_porch: 23
    vsync_front_porch: 12
    # EK79007 vendor register block, then sleep-out. Byte-for-byte from the
    # BSP's vendor_specific_init_default[].
    init_sequence:
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11]
      - delay 120ms
    update_interval: never
    auto_clear_enabled: false

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  displays: my_display
  # EK79007 is natively landscape 1024x600, so no base rotation is needed
  # (the Guition panel this config descends from is mounted inverted).
  rotation: 0
  byte_order: little_endian
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

script:
  - id: apply_screen_rotation
    then:
      # Identity mapping: the 7B's native orientation is already upright, so
      # the selected angle is the angle applied. (The Guition config this came
      # from offsets by 180 because that panel is mounted inverted.)
      - if:
          condition:
            lambda: 'return id(screen_rotation_select).current_option() == "90";'
          then:
            - lvgl.display.set_rotation: 90
          else:
            - if:
                condition:
                  lambda: 'return id(screen_rotation_select).current_option() == "180";'
                then:
                  - lvgl.display.set_rotation: 180
                else:
                  - if:
                      condition:
                        lambda: 'return id(screen_rotation_select).current_option() == "270";'
                      then:
                        - lvgl.display.set_rotation: 270
                      else:
                        - lvgl.display.set_rotation: 0
      - script.execute: cover_art_apply_responsive_layout

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "0"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(screen_rotation_ready);'
            then:
              - script.execute: apply_screen_rotation
              - script.execute: refresh_button_grid
