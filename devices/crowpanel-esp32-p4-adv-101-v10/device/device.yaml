# =============================================================================
# DEVICE - Elecrow CrowPanel Advanced 10.1" ESP32-P4 (V1.0) hardware definition
# =============================================================================
# Pin assignments, peripherals, and platform config for the 1024x600 10.1"
# touch panel. Includes the ESP32-P4 main SoC, ESP32-C6 hosted WiFi
# co-processor, MIPI DSI display, GT911 capacitive touchscreen, and
# backlight PWM.
#
# Ported from the config shared by @schnoog in
# lamiskin/espcontrol-community-devices#133
# (github.com/schnoog/espcontrol-community-devices_CP10.1), with pin names
# cross-checked against Elecrow's wiki page for the panel.
#
# This file targets the board silkscreened **V1.0**. Elecrow changed the
# ESP32-C6 socket wiring twice after it: V1.1 reorders SDIO D0-D3
# (IO14/15/16/17 -> IO17/16/15/14) and V1.2 swaps IO53/IO54 with IO27/IO28.
# A later board therefore needs its own slug rather than an edit here.
# =============================================================================

substitutions:
  espcontrol_component_url: "https://github.com/jtenniswood/espcontrol"
  espcontrol_component_ref: "v2.11.0"
  mdi_font_file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"

# ---------------------------------------------------------------------------
# ESP32-P4 platform (16MB flash, ESP-IDF framework)
# ---------------------------------------------------------------------------
esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHZ
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_SDMMC_HOST_DEFAULT: "y"
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_SPI_FLASH_YIELD_DURING_ERASE: "n"
      # ESP-Hosted preallocates a DMA transport buffer pool before ESPHome
      # starts; disabling it (our old fix here) avoided the "HS_MP: mempool
      # create failed: no mem" OTA-rollback boot failure but left inbound HA
      # API/web requests dependent on dynamic buffer allocation, which can
      # silently starve and never recover (jtenniswood/espcontrol#1099).
      # Upstream's real fix keeps the pool but relocates it to PSRAM instead
      # (esp32_hosted: use_psram: true below), which fixes both. Let
      # WiFi/LWIP buffers use PSRAM too.
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS: "1"
      CONFIG_LOG_DEFAULT_LEVEL: "2"

# ---------------------------------------------------------------------------
# External components
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: ${espcontrol_component_url}
      ref: ${espcontrol_component_ref}
      path: components
    components: [espcontrol, web_server_idf, artwork_image]
    refresh: 1s

espcontrol:
  id: espcontrol_app
  panel_config:
    device_profile: ${device_slug}
    storage: card_images
    button_order: button_order
    button_on_color: button_on_color
    buttons:
      - config: button_1_config
        subpage_chunks: [subpage_1_config, subpage_1_config_ext, subpage_1_config_ext_2, subpage_1_config_ext_3, subpage_1_config_ext_4, subpage_1_config_ext_5, subpage_1_config_ext_6, subpage_1_config_ext_7]
      - config: button_2_config
        subpage_chunks: [subpage_2_config, subpage_2_config_ext, subpage_2_config_ext_2, subpage_2_config_ext_3, subpage_2_config_ext_4, subpage_2_config_ext_5, subpage_2_config_ext_6, subpage_2_config_ext_7]
      - config: button_3_config
        subpage_chunks: [subpage_3_config, subpage_3_config_ext, subpage_3_config_ext_2, subpage_3_config_ext_3, subpage_3_config_ext_4, subpage_3_config_ext_5, subpage_3_config_ext_6, subpage_3_config_ext_7]
      - config: button_4_config
        subpage_chunks: [subpage_4_config, subpage_4_config_ext, subpage_4_config_ext_2, subpage_4_config_ext_3, subpage_4_config_ext_4, subpage_4_config_ext_5, subpage_4_config_ext_6, subpage_4_config_ext_7]
      - config: button_5_config
        subpage_chunks: [subpage_5_config, subpage_5_config_ext, subpage_5_config_ext_2, subpage_5_config_ext_3, subpage_5_config_ext_4, subpage_5_config_ext_5, subpage_5_config_ext_6, subpage_5_config_ext_7]
      - config: button_6_config
        subpage_chunks: [subpage_6_config, subpage_6_config_ext, subpage_6_config_ext_2, subpage_6_config_ext_3, subpage_6_config_ext_4, subpage_6_config_ext_5, subpage_6_config_ext_6, subpage_6_config_ext_7]
      - config: button_7_config
        subpage_chunks: [subpage_7_config, subpage_7_config_ext, subpage_7_config_ext_2, subpage_7_config_ext_3, subpage_7_config_ext_4, subpage_7_config_ext_5, subpage_7_config_ext_6, subpage_7_config_ext_7]
      - config: button_8_config
        subpage_chunks: [subpage_8_config, subpage_8_config_ext, subpage_8_config_ext_2, subpage_8_config_ext_3, subpage_8_config_ext_4, subpage_8_config_ext_5, subpage_8_config_ext_6, subpage_8_config_ext_7]
      - config: button_9_config
        subpage_chunks: [subpage_9_config, subpage_9_config_ext, subpage_9_config_ext_2, subpage_9_config_ext_3, subpage_9_config_ext_4, subpage_9_config_ext_5, subpage_9_config_ext_6, subpage_9_config_ext_7]
      - config: button_10_config
        subpage_chunks: [subpage_10_config, subpage_10_config_ext, subpage_10_config_ext_2, subpage_10_config_ext_3, subpage_10_config_ext_4, subpage_10_config_ext_5, subpage_10_config_ext_6, subpage_10_config_ext_7]
      - config: button_11_config
        subpage_chunks: [subpage_11_config, subpage_11_config_ext, subpage_11_config_ext_2, subpage_11_config_ext_3, subpage_11_config_ext_4, subpage_11_config_ext_5, subpage_11_config_ext_6, subpage_11_config_ext_7]
      - config: button_12_config
        subpage_chunks: [subpage_12_config, subpage_12_config_ext, subpage_12_config_ext_2, subpage_12_config_ext_3, subpage_12_config_ext_4, subpage_12_config_ext_5, subpage_12_config_ext_6, subpage_12_config_ext_7]
      - config: button_13_config
        subpage_chunks: [subpage_13_config, subpage_13_config_ext, subpage_13_config_ext_2, subpage_13_config_ext_3, subpage_13_config_ext_4, subpage_13_config_ext_5, subpage_13_config_ext_6, subpage_13_config_ext_7]
      - config: button_14_config
        subpage_chunks: [subpage_14_config, subpage_14_config_ext, subpage_14_config_ext_2, subpage_14_config_ext_3, subpage_14_config_ext_4, subpage_14_config_ext_5, subpage_14_config_ext_6, subpage_14_config_ext_7]
      - config: button_15_config
        subpage_chunks: [subpage_15_config, subpage_15_config_ext, subpage_15_config_ext_2, subpage_15_config_ext_3, subpage_15_config_ext_4, subpage_15_config_ext_5, subpage_15_config_ext_6, subpage_15_config_ext_7]

# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_flags:
    - "-Wno-deprecated-declarations"
    - "-DESPCONTROL_DISABLE_TODO=1"
    - "-DESPCONTROL_ESPHOME_2026_5_REBUILD=1"
    - "-DESPCONTROL_CROWPANEL_P4_ADV_101_V10_20260917=1"
    - "-Wno-literal-suffix"
    - "-Wno-complain-wrong-lang"
  on_boot:
    - priority: 260
      then:
        - if:
            condition:
              lambda: |-
                #ifdef USE_ESP32_CRASH_HANDLER
                return esphome::esp32::crash_handler_has_data();
                #else
                return false;
                #endif
            then:
              - lambda: |-
                  #ifdef USE_ESP32_CRASH_HANDLER
                  esphome::esp32::crash_handler_clear();
                  #endif
                  id(crowpanel_p4_101_safe_mode).mark_successful();
                  global_preferences->sync();
                  ESP_LOGW("crowpanel_p4_101", "Cleared saved crash report before API logging; rebooting once");
              - delay: 500ms
              - lambda: |-
                  App.safe_reboot();
    - priority: 250
      then:
        - lambda: |-
            ESP_LOGI("crowpanel_p4_101", "Elecrow CrowPanel Advanced 10.1 ESP32-P4 (V1.0) boot");
    # GT911 touch controller shares the LCD reset line. The display driver
    # pulls the reset high during init; give it time to settle before the
    # touchscreen driver tries to communicate with the GT911.
    - priority: -150
      then:
        - delay: 300ms
    - priority: -100
      then:
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: apply_screen_rotation

# ---------------------------------------------------------------------------
# ESP32-C6 co-processor (provides WiFi/BLE via SDIO)
# ---------------------------------------------------------------------------
esp32_hosted:
  variant: esp32c6
  # Keep the preallocated transport receive buffers for reliable inbound
  # connections, but place them in PSRAM to protect scarce internal memory.
  use_psram: true
  reset_pin: GPIO32
  cmd_pin: GPIO19
  clk_pin: GPIO18
  # The SDIO link runs 1-bit wide here, so d1_pin-d3_pin are deliberately
  # absent. That is what the porter's V1.0 board came up on ("only 1 data
  # line to esp_hosted", issue #133), even though Elecrow's wiki lists
  # IO14/15/16/17 as D0-D3 for this revision — so a 4-bit link may be wired
  # on some V1.0 units. Confirm against a board before widening it: a wrong
  # bus width costs throughput at best and a dead WiFi co-processor at worst.
  bus_width: 1
  d0_pin: GPIO14
  active_high: true
  sdio_frequency: 40MHz

# ---------------------------------------------------------------------------
# PSRAM (video frame buffer memory)
# ---------------------------------------------------------------------------
psram:
  mode: hex
  speed: 200MHz

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: crowpanel_p4_101_safe_mode

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# The panel's USB-C serial console is exposed through a UART0 bridge.
logger:
  hardware_uart: UART0

# ---------------------------------------------------------------------------
# Power management (LDO channel for DSI PHY)
# ---------------------------------------------------------------------------
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: True

# ---------------------------------------------------------------------------
# Backlight (LEDC PWM output + monochromatic light entity)
# ---------------------------------------------------------------------------
# LCD_BK_EN (IO31) is the PWM dimming line. The board also exposes
# LCD_BK_POWER (IO29) as a backlight rail enable; it is left unconfigured
# because the panel lit up without it on the porter's board. If a unit ever
# boots with a dark screen, driving IO29 high is the first thing to try.
output:
  - platform: ledc
    pin: GPIO31
    id: gpio_backlight_pwm

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                auto now = panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now());
                return (id(espcontrol_app).display().target_source_is(
                            espcontrol::DisplayRequestSource::SCREEN_SCHEDULE) &&
                        id(espcontrol_app).display().target_mode_is(
                            espcontrol::DisplayMode::DISPLAY_OFF)) ||
                       screen_schedule_waiting_for_time(
                         id(screen_schedule_trigger).state,
                         id(schedule_enabled).state,
                         now.is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(espcontrol_app).display().current_mode_is(
                          espcontrol::DisplayMode::DISPLAY_OFF);
                  then:
                    - script.execute: screensaver_wake
    on_turn_off:
      then:
        - if:
            condition:
              lambda: |-
                return id(espcontrol_app).display().takeover_active(
                           espcontrol::DisplayTakeoverKind::INTERACTIVE) ||
                       id(espcontrol_app).display().takeover_active(
                           espcontrol::DisplayTakeoverKind::CRITICAL);
            then:
              - lambda: 'ESP_LOGD("backlight", "Restoring backlight after OFF event during display takeover");'
              - delay: 10ms
              - script.execute: backlight_apply_brightness
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(espcontrol_app).display().target_mode_is(
                          espcontrol::DisplayMode::ACTIVE);
                  then:
                    - script.execute: screen_schedule_manual_sleep
    on_state:
      then:
        - script.execute: display_backlight_handle_state

# ---------------------------------------------------------------------------
# I2C bus and touchscreen (GT911 capacitive, wakes screensaver on touch)
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz

# Elecrow's wiki names RESET_TP as IO40, but the working config this port came
# from leaves the GT911 reset line unconfigured and the controller answers
# anyway. It is left out here to match what has actually booted; if a cold
# boot ever comes up with dead touch, wiring reset_pin: GPIO40 is the first
# thing to try (the same failure mode as issue #113 on the reTerminal).
touchscreen:
  - platform: gt911
    id: my_touchscreen
    interrupt_pin: GPIO42
    setup_priority: -200
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - script.execute: cover_art_pause_after_touch
      - script.wait: cover_art_pause_after_touch
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (10.1" 1024x600 native-landscape MIPI DSI panel, EK79007)
#
# ESPHome has no CrowPanel model, but WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B is
# the same 1024x600 EK79007 panel (its timings and init sequence come from
# esp-iot-solution's esp_lcd_ek79007), which is the driver IC Elecrow
# documents for the CrowPanel Advanced. The model's own default reset pin is
# the Waveshare board's, so reset_pin is spelled out for this board.
# ---------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    color_order: RGB
    reset_pin:
      number: GPIO41
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  displays: my_display
  rotation: 0
  byte_order: little_endian
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

# The panel scans natively in landscape the right way up, so the rotation
# select maps straight through to the LVGL rotation with no offset - unlike
# the portrait-native P4 panels in this repo, which carry a 90 or 180 offset
# here and a matching rotation.displayOffset in the catalog entry.
script:
  - id: apply_screen_rotation
    then:
      - if:
          condition:
            lambda: 'return id(screen_rotation_select).current_option() == "90";'
          then:
            - lvgl.display.set_rotation: 90
          else:
            - if:
                condition:
                  lambda: 'return id(screen_rotation_select).current_option() == "180";'
                then:
                  - lvgl.display.set_rotation: 180
                else:
                  - if:
                      condition:
                        lambda: 'return id(screen_rotation_select).current_option() == "270";'
                      then:
                        - lvgl.display.set_rotation: 270
                      else:
                        - lvgl.display.set_rotation: 0
      - script.execute: cover_art_apply_responsive_layout

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "0"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(screen_rotation_ready);'
            then:
              - script.execute: apply_screen_rotation
              - script.execute: refresh_button_grid

# ---------------------------------------------------------------------------
# Audio - PDM microphone + external I2S speaker amp
# ---------------------------------------------------------------------------
# Pins contributed and hardware-confirmed by @schnoog (community issue #133)
# on his own CrowPanel unit — these are specific to this board, not carried
# over from another device unverified (this repo has been bitten by exactly
# that before: an earlier revision of @schnoog's own fork carried reTerminal
# D1001 audio pins with only the header comment changed).
#
# Two separate I2S peripherals (mic in, speaker out), same shape as the P4
# reTerminal D1001's device/audio.yaml + device/microphone.yaml: clocks live
# on the i2s_audio bus below, data pins live on the microphone/speaker
# platform entries. No onboard codec to configure over I2C here (unlike the
# reTerminal's ES8311) — the NS4168 speaker amp and the PDM mic both take
# I2S directly.
# ---------------------------------------------------------------------------
i2s_audio:
  # I2S bus for the PDM microphone (clock only; data is on i2s_din_pin below)
  - id: i2s_mic
    i2s_lrclk_pin: GPIO24
  # I2S bus for the external speaker amplifier
  - id: i2s_spk
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO22

microphone:
  # PDM digital microphone
  - platform: i2s_audio
    id: pdm_mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO26
    adc_type: external
    pdm: true

# ---------------------------------------------------------------------------
# Speaker pipeline: media + announcement resamplers -> mixer -> speaker,
# mirroring the reTerminal D1001's device/audio.yaml. announcement_mixing_input
# and media_mixing_input are not free-form names — the vendored espcontrol
# component's media_player wiring expects these exact ids.
# ---------------------------------------------------------------------------
speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_spk
    i2s_dout_pin: GPIO23
    dac_type: external

  - platform: mixer
    id: mixing_speaker
    output_speaker: my_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

# ---------------------------------------------------------------------------
# Media player — lets Home Assistant cast TTS announcements and media to the
# panel. Not part of @schnoog's confirmed snippet (which stopped at the
# speaker pipeline above); added so that pipeline is actually reachable,
# following the reTerminal D1001's media_player shape. Pending hardware
# confirmation like the rest of this block.
# ---------------------------------------------------------------------------
media_player:
  - platform: speaker
    id: onboard_media_player
    name: Speaker
    icon: mdi:speaker
    buffer_size: 1000000
    task_stack_in_psram: true
    volume_min: 0.0
    volume_max: 0.85
    volume_initial: 0.5
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_speaker
      format: NONE
      sample_rate: 48000
