# =============================================================================
# ESPHOME ENTRY POINT - Waveshare ESP32-S3 Smart 86 Box
# =============================================================================
# User-facing config file. Set your device name and WiFi credentials here.
# The remote package reference pulls in the full device configuration from
# GitHub so the device stays up-to-date automatically.
# =============================================================================

# ---------------------------------------------------------------------------
# Device identity
# ---------------------------------------------------------------------------
substitutions:
  name: "your-device-name"
  friendly_name: "Your Device Name"

# ---------------------------------------------------------------------------
# WiFi credentials (stored in secrets.yaml)
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------------------
# Remote package (pulls full config from GitHub)
# ---------------------------------------------------------------------------
packages:
  setup:
    url: https://github.com/lamiskin/espcontrol-community-devices/
    file: devices/waveshare-esp32-s3-smart-86-box/packages.yaml
    refresh: 1s

# ---------------------------------------------------------------------------
# Keyless API encryption (upstream's common/addon/api_encryption_dynamic.yaml).
# The first provisioning connection is plaintext; Home Assistant then supplies a
# per-device key the panel keeps. Set your own api.encryption.key here to
# override it.
# ---------------------------------------------------------------------------
api:
  encryption: {}
